<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paimon's Celestial Observatory</title>
    <style>
        :root {
            --bg-color: #0b1021;
            --panel-bg: rgba(20, 25, 45, 0.85);
            --border-gold: #d4af37;
            --text-main: #e8e9eb;
            --text-muted: #8e95a5;
            --accent-blue: #4a90e2;
            --paimon-highlight: #ffb7c5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: linear-gradient(to bottom, rgba(11, 16, 33, 0.9), transparent);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--border-gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
        }

        button {
            background: rgba(30, 40, 70, 0.6);
            border: 1px solid var(--border-gold);
            color: var(--text-main);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        button:hover {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            background: rgba(74, 144, 226, 0.2);
            border: 1px solid rgba(74, 144, 226, 0.5);
            border-bottom-right-radius: 2px;
        }

        .message.paimon {
            align-self: flex-start;
            background: rgba(255, 183, 197, 0.1);
            border: 1px solid rgba(255, 183, 197, 0.4);
            border-bottom-left-radius: 2px;
            box-shadow: 0 0 15px rgba(255, 183, 197, 0.05);
        }

        .wiki-context {
            font-size: 0.8rem;
            color: var(--border-gold);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(212, 175, 55, 0.3);
            font-style: italic;
        }

        #input-area {
            padding: 20px;
            background: var(--panel-bg);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 900px;
        }

        textarea {
            flex-grow: 1;
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid var(--border-gold);
            color: white;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 50px;
            font-size: 1rem;
            outline: none;
            transition: box-shadow 0.2s;
        }

        textarea:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .presets {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            max-width: 900px;
            width: 100%;
            overflow-x: auto;
        }

        .presets button {
            background: transparent;
            border: 1px dashed var(--text-muted);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        /* Modal Styles */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-color);
            border: 2px solid var(--border-gold);
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .modal-content h2 { color: var(--border-gold); margin-bottom: 10px; }
        .modal-content p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; }
        .modal-content label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .modal-content input, .modal-content select {
            width: 100%; padding: 10px; margin-bottom: 20px;
            background: rgba(255,255,255,0.1); border: 1px solid var(--border-gold);
            color: white; border-radius: 5px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 15px;
            color: var(--paimon-highlight);
            font-style: italic;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header>
        <h1>✨ Paimon's Celestial Observatory</h1>
        <div class="header-controls">
            <button id="fact-mode-btn" onclick="toggleFactMode()">Mode: Standard</button>
            <button id="audio-btn" onclick="toggleAudio()">Audio: ON</button>
            <button onclick="openSettings()">⚙️ Settings</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="message paimon">
            Ehe! Paimon is here! Before we start exploring Teyvat, make sure to add your Groq API Key using the <b>⚙️ Settings</b> button above!
        </div>
    </div>
    
    <div class="typing-indicator" id="typing-indicator">Paimon is thinking...</div>

    <div id="input-area">
        <div class="presets">
            <button onclick="usePreset('Tell me about the Anemo Archon')">Anemo Archon</button>
            <button onclick="usePreset('What materials do I need to ascend Ayaka?')">Ayaka Materials</button>
            <button onclick="usePreset('Explain the history of Khaenri\'ah')">Khaenri'ah Lore</button>
        </div>
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="Ask Paimon something..." onkeypress="handleEnter(event)"></textarea>
            <button onclick="sendMessage()" style="padding: 0 25px; font-weight: bold;">Send</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h2>⚙️ API Settings</h2>
            <p>Enter your free Groq API key from console.groq.com. It will be stored safely in your browser.</p>
            
            <label>Groq API Key</label>
            <input type="password" id="api-key-input" placeholder="gsk_...">
            
            <label>Model</label>
            <select id="model-select">
                <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Recommended)</option>
                <option value="llama-3.1-8b-instant">Llama 3.1 8B (Fast)</option>
                <option value="gemma2-9b-it">Gemma 2 9B</option>
            </select>
            
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="closeSettings()" style="background: transparent;">Cancel</button>
                <button onclick="saveSettings()">Save & Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- STATE ---
        let groqApiKey = localStorage.getItem('groqApiKey') || "";
        let currentModel = localStorage.getItem('groqModel') || "llama-3.3-70b-versatile";
        let isStrictFactMode = false;
        let isAudioEnabled = true;
        let chatHistory = [];

        // Prompt user for key if missing on startup
        window.addEventListener('DOMContentLoaded', () => {
            if (!groqApiKey) {
                openSettings();
            }
        });

        // Paimon System Prompt
        const paimonPrompt = `You are Paimon, the traveler's enthusiastic, food-loving guide from Genshin Impact. 
        Rules: 
        1. ALWAYS refer to yourself in the 3rd person as "Paimon" (never say "I" or "me"). 
        2. Be extremely energetic, cheerful, and sometimes a little greedy for Mora or food. Use phrases like "Ehe!", "Ooh!", or "Paimon thinks...".
        3. If provided with [WIKI CONTEXT], use it accurately to answer the user.
        4. Keep your formatting clean but playful.`;

        // --- AUDIO ENGINE (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (!isAudioEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'send') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'receive') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- WIKI RAG FETCHER ---
        async function fetchWikiContext(query) {
            try {
                const keywords = query.split(' ').filter(w => w.length > 3).join(' ');
                if (!keywords) return null;

                const url = `https://genshin-impact.fandom.com/api.php?action=query&list=search&srsearch=${encodeURIComponent(keywords)}&utf8=&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.query && data.query.search && data.query.search.length > 0) {
                    const snippets = data.query.search.slice(0, 2).map(s => s.title + ": " + s.snippet.replace(/<[^>]*>?/gm, '')).join('\n');
                    return snippets;
                }
            } catch (e) {
                console.error("Wiki fetch failed", e);
            }
            return null;
        }

        // --- GROQ API CALL ---
        async function getGroqResponse(userText, wikiContext) {
            if (!groqApiKey) {
                openSettings();
                return "Paimon needs a Groq API Key to work her magic! Please enter your key in the Settings menu that just popped up.";
            }

            let systemInstruction = paimonPrompt;
            if (wikiContext) {
                systemInstruction += `\n\n[WIKI CONTEXT]:\n${wikiContext}`;
                if (isStrictFactMode) {
                    systemInstruction += `\n\nSTRICT MODE: ONLY answer using the provided wiki context. If the answer isn't there, say Paimon doesn't know.`;
                }
            }

            const messages = [
                { role: "system", content: systemInstruction },
                ...chatHistory,
                { role: "user", content: userText }
            ];

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${groqApiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        return "Paimon says: That API key doesn't seem to work! Please check your key in Settings.";
                    }
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const data = await response.json();
                const reply = data.choices[0].message.content;
                
                chatHistory.push({ role: "user", content: userText });
                chatHistory.push({ role: "assistant", content: reply });
                
                if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

                return reply;
            } catch (error) {
                return `Ugh, Paimon got a headache... (${error.message})`;
            }
        }

        // --- UI LOGIC ---
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            addMessageToUI(text, 'user');
            playSound('send');
            
            document.getElementById('typing-indicator').style.display = 'block';
            scrollToBottom();

            const wikiContext = await fetchWikiContext(text);
            const paimonReply = await getGroqResponse(text, wikiContext);

            document.getElementById('typing-indicator').style.display = 'none';
            addMessageToUI(paimonReply, 'paimon', wikiContext ? true : false);
            playSound('receive');
            scrollToBottom();
        }

        function addMessageToUI(text, sender, usedWiki = false) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\*(.*?)\*/g, '<i>$1</i>');
            msgDiv.innerHTML = formattedText;

            if (usedWiki && sender === 'paimon') {
                const wikiBadge = document.createElement('div');
                wikiBadge.className = 'wiki-context';
                wikiBadge.innerText = '✦ Paimon peeked at the Irminsul (Wiki) for this!';
                msgDiv.appendChild(wikiBadge);
            }

            container.insertBefore(msgDiv, document.getElementById('typing-indicator'));
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function usePreset(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        // --- SETTINGS & CONTROLS ---
        function openSettings() {
            document.getElementById('api-key-input').value = groqApiKey || '';
            document.getElementById('model-select').value = currentModel;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            groqApiKey = document.getElementById('api-key-input').value.trim();
            currentModel = document.getElementById('model-select').value;
            
            localStorage.setItem('groqApiKey', groqApiKey);
            localStorage.setItem('groqModel', currentModel);
            
            closeSettings();
        }

        function toggleFactMode() {
            isStrictFactMode = !isStrictFactMode;
            document.getElementById('fact-mode-btn').innerText = `Mode: ${isStrictFactMode ? 'STRICT' : 'Standard'}`;
            document.getElementById('fact-mode-btn').style.borderColor = isStrictFactMode ? '#ff4d4d' : 'var(--border-gold)';
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            document.getElementById('audio-btn').innerText = `Audio: ${isAudioEnabled ? 'ON' : 'OFF'}`;
            if(isAudioEnabled && audioCtx.state === 'suspended') audioCtx.resume();
        }

        // --- CANVAS BACKGROUND ENGINE ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.05
                });
            }
        }

        function drawAstrolabe() {
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.rotate(time * 0.002);
            
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.1)';
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            ctx.arc(0, 0, height * 0.4, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, height * 0.25, 0, Math.PI * 2);
            ctx.stroke();

            for(let i=0; i<8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(0, height * 0.25);
                ctx.lineTo(0, height * 0.4);
                ctx.stroke();
            }
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed *= -1;
                
                ctx.globalAlpha = Math.abs(star.alpha) * 0.8;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalAlpha = 1;
            drawAstrolabe();

            time++;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();

    </script>
</body>
</html>
