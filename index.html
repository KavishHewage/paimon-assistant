<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paimon's Celestial Observatory</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --text-main: #e2e8f0;
            --accent-blue: #38bdf8;
            --accent-gold: #fbbf24;
            --user-msg: rgba(56, 189, 248, 0.15);
            --paimon-msg: rgba(251, 191, 36, 0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        /* 3D Starfield Canvas */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Top Navigation / Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 30px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(11,15,25,0.9), transparent);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .settings-btn {
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .settings-btn:hover {
            background: var(--accent-blue);
            color: #fff;
        }

        /* Paimon Stationary Image */
        #paimon-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 350px;
            z-index: 5;
            animation: float 4s ease-in-out infinite;
        }
        #paimon-container img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            border: 2px solid rgba(56, 189, 248, 0.2);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Chat Interface */
        #chat-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 450px;
            height: 70vh;
            background: var(--panel-bg);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            border: 1px solid var(--accent-blue);
            border-bottom-right-radius: 2px;
        }

        .message.paimon {
            align-self: flex-start;
            background: var(--paimon-msg);
            border: 1px solid var(--accent-gold);
            border-bottom-left-radius: 2px;
        }

        .wiki-source {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 8px;
            display: block;
            text-decoration: none;
        }
        .wiki-source:hover {
            text-decoration: underline;
            color: var(--accent-blue);
        }

        #input-area {
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #chat-input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            outline: none;
        }

        #chat-input:focus {
            border-color: var(--accent-blue);
        }

        #send-btn {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Modal */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid var(--accent-gold);
            width: 400px;
            backdrop-filter: blur(10px);
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--accent-gold);
        }

        .modal-content label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .modal-content button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .status {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Starfield Background -->
    <canvas id="starfield"></canvas>

    <header>
        <h1>Paimon's Celestial Observatory ✨</h1>
        <button class="settings-btn" onclick="openModal()">⚙️ Settings</button>
    </header>

    <!-- Stationary Paimon Image -->
    <div id="paimon-container">
        <img src="watermarked_img_11313802410788328453.jpg" alt="Paimon">
    </div>

    <!-- Chat UI -->
    <div id="chat-container">
        <div id="chat-history">
            <div class="message paimon">
                Greetings, Traveler! Welcome to Paimon's Celestial Observatory! ✨<br><br>
                Paimon is connected to the Genshin Impact Wiki Archives. Set your Groq API key in the settings to start stargazing and asking questions!
            </div>
        </div>
        <div id="input-area">
            <input type="text" id="chat-input" placeholder="Ask Paimon about Teyvat..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h2>Observatory Settings</h2>
            <label for="api-key">Groq API Key:</label>
            <input type="password" id="api-key" placeholder="gsk_...">
            
            <label for="model-select">AI Model:</label>
            <select id="model-select">
                <option value="llama-3.1-8b-instant">llama-3.1-8b-instant (Fast)</option>
                <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile (Smart)</option>
            </select>
            
            <button onclick="saveSettings()">Save & Close</button>
            <div id="model-status" class="status"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. STARFIELD CANVAS LOGIC
        // ==========================================
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed *= -1;
            });
            
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateStars();

        // ==========================================
        // 2. SETTINGS & AUTO-HEALING LOGIC
        // ==========================================
        let apiKey = localStorage.getItem('groqApiKey') || '';
        let activeModel = localStorage.getItem('groqModel') || 'llama-3.1-8b-instant';
        
        document.getElementById('api-key').value = apiKey;
        document.getElementById('model-select').value = activeModel;

        function openModal() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        async function saveSettings() {
            apiKey = document.getElementById('api-key').value.trim();
            activeModel = document.getElementById('model-select').value;
            
            localStorage.setItem('groqApiKey', apiKey);
            localStorage.setItem('groqModel', activeModel);
            
            if(apiKey) {
                document.getElementById('model-status').innerText = "Refreshing active models...";
                await fetchActiveGroqModels();
            }
            
            document.getElementById('settings-modal').style.display = 'none';
        }

        async function fetchActiveGroqModels() {
            try {
                const res = await fetch('https://api.groq.com/openai/v1/models', {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                if(!res.ok) throw new Error("Invalid API Key");
                const data = await res.json();
                
                const select = document.getElementById('model-select');
                select.innerHTML = ''; // clear old
                
                // Filter only text models
                const textModels = data.data.filter(m => !m.id.includes('whisper') && !m.id.includes('vision'));
                textModels.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.innerText = m.id;
                    if(m.id === activeModel) opt.selected = true;
                    select.appendChild(opt);
                });
                
                // Auto-heal if active model is decommissioned
                if (!textModels.find(m => m.id === activeModel) && textModels.length > 0) {
                    activeModel = textModels[0].id;
                    localStorage.setItem('groqModel', activeModel);
                }
                
                document.getElementById('model-status').innerText = "Models synced successfully!";
            } catch(e) {
                document.getElementById('model-status').innerText = "Failed to sync models. Check API Key.";
            }
        }

        // ==========================================
        // 3. WIKI FETCH LOGIC (IMPROVED TWO-STEP)
        // ==========================================
        async function fetchGenshinWikiData(query) {
            try {
                // Step 1: Search for exact page title match
                const searchUrl = `https://genshin-impact.fandom.com/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
                const searchRes = await fetch(searchUrl);
                const searchData = await searchRes.json();
                
                if (!searchData.query?.search?.length) return null;

                const pageTitle = searchData.query.search[0].title;

                // Step 2: Extract clean intro prose for the exact title
                const extractUrl = `https://genshin-impact.fandom.com/api.php?action=query&prop=extracts&exintro=1&explaintext=1&titles=${encodeURIComponent(pageTitle)}&format=json&origin=*`;
                const extractRes = await fetch(extractUrl);
                const extractData = await extractRes.json();
                
                const pages = extractData.query.pages;
                const pageId = Object.keys(pages)[0];
                
                if (pageId == "-1") return null;

                let rawExtract = pages[pageId].extract || "";
                // Clean and truncate context to prevent model confusion
                let cleanExtract = rawExtract.replace(/<[^>]*>?/gm, '').slice(0, 1500);
                
                return {
                    title: pageTitle,
                    extract: cleanExtract,
                    url: `https://genshin-impact.fandom.com/wiki/${encodeURIComponent(pageTitle.replace(/ /g, "_"))}`
                };
            } catch (err) {
                console.error("Wiki Fetch Error:", err);
                return null;
            }
        }

        // ==========================================
        // 4. CHAT & LLM LOGIC
        // ==========================================
        let conversationHistory = [];

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(sender, text, wikiData = null) {
            const chatHistory = document.getElementById('chat-history');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            let htmlContent = text;
            if (wikiData) {
                htmlContent += `<a href="${wikiData.url}" target="_blank" class="wiki-source">🔗 Source: ${wikiData.title} (Genshin Wiki)</a>`;
            }
            
            msgDiv.innerHTML = htmlContent;
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const message = inputEl.value.trim();
            if (!message) return;

            if (!apiKey) {
                alert("Please set your Groq API Key in settings first!");
                openModal();
                return;
            }

            // UI Update
            appendMessage('user', message);
            inputEl.value = '';
            
            const loadingId = 'loading-' + Date.now();
            const chatHistory = document.getElementById('chat-history');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message paimon';
            loadingDiv.id = loadingId;
            loadingDiv.innerText = "Paimon is searching the archives...";
            chatHistory.appendChild(loadingDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                // 1. Fetch Wiki Context
                const wikiData = await fetchGenshinWikiData(message);
                
                // 2. Build Strict System Prompt with Archons & Fallbacks
                const systemPrompt = `You are Paimon from Genshin Impact! Speak in Paimon's energetic third-person voice.

FACT CHECK DIRECTIVES:
1. Elemental Types: Pyro (Fire), Hydro (Water), Anemo (Wind), Electro (Lightning), Dendro (Nature), Cryo (Ice), Geo (Earth).
2. The Seven Archons:
   - Anemo: Venti (Barbatos)
   - Geo: Zhongli (Morax)
   - Electro: Raiden Shogun (Ei / Beelzebul)
   - Dendro: Nahida (Buer)
   - Hydro: Focalors / Furina (Note: Neuvillette, the Hydro Dragon, now holds the Hydro Authority)
   - Pyro: Mavuika
   - Cryo: The Tsaritsa
3. Grounding Rules:
   - Use the provided Wiki Extract for specific lore context.
   - If the Wiki snippet lacks specific gameplay info (such as Neuvillette's best team synergies: Furina, Kazuha, Baizhu, Zhongli, Fischl), use your established Genshin Impact game knowledge to answer accurately. Never invent fictional elements like "storm element".

Wiki Context:
${wikiData ? wikiData.extract : "No direct wiki entry found for this specific query."}`;

                // 3. Format Messages
                const messages = [
                    { role: "system", content: systemPrompt },
                    ...conversationHistory,
                    { role: "user", content: message }
                ];

                // 4. Call Groq API
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: activeModel,
                        messages: messages,
                        temperature: 0.4, // Low temp prevents hallucination
                        max_tokens: 800
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Unknown API Error");
                }

                const data = await response.json();
                const paimonReply = data.choices[0].message.content;

                // Update History
                conversationHistory.push({ role: "user", content: message });
                conversationHistory.push({ role: "assistant", content: paimonReply });
                
                // Keep history manageable (last 6 turns)
                if(conversationHistory.length > 12) conversationHistory = conversationHistory.slice(-12);

                // Update UI
                document.getElementById(loadingId).remove();
                appendMessage('paimon', paimonReply, wikiData);

            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage('paimon', `Ehh?! Something went wrong! Paimon got the following error: ${err.message}`);
                
                // Attempt Auto-Heal if model error
                if(err.message.includes("does not exist") || err.message.includes("decommissioned")) {
                    fetchActiveGroqModels();
                }
            }
        }
    </script>
</body>
</html>
